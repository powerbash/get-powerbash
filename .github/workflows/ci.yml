name: CI
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # index.html is a bash script, so shellcheck needs to be told the shell
      # rather than guessing from the extension.
      - run: shellcheck -s bash index.html tests/*.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # macOS runs the suite under bash 3.2.57 and BSD userland -- the exact
      # combination a `curl | bash` on a stock Mac lands in.
      - name: Show bash version
        run: /bin/bash --version | head -1

      - name: Install round trip
        run: /bin/bash tests/install-test.sh

  # bash 3.2 on Linux/musl, alongside the macOS/BSD coverage above.
  bash32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install round trip under bash 3.2
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /tmp bash:3.2 sh -c '
            apk add --no-cache curl diffutils >/dev/null &&
            adduser -D tester &&
            bash --version | head -1 &&
            su tester -c "bash /src/tests/install-test.sh"
          '

  # The installed script has to actually be the real powerbash.sh, not just
  # something shaped like it. This is the only job that touches the network.
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install from download.powerbash.org and render a prompt
        run: |
          set -e
          export HOME="$(mktemp -d)"
          touch "$HOME/.bashrc"

          bash index.html

          # A login-ish shell reading the startup file must end up with a
          # working powerbash and a non-empty PS1.
          bash -c '
            PS1=x
            . "$HOME/.bashrc"
            powerbash version
            PS1=""; __powerbash_set_ps1 on
            [ -n "$PS1" ] || { echo "empty PS1 after install" >&2; exit 1; }
          '

          bash index.html uninstall
          [ -e "$HOME/.local/share/powerbash/powerbash.sh" ] && exit 1
          echo "live install/uninstall round trip ok"
